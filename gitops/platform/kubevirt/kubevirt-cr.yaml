apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  imagePullPolicy: IfNotPresent
  configuration:
    developerConfiguration:
      # false: Colima vz + nested virt exposes real /dev/kvm.
      # Set true on Docker Desktop / Podman (no /dev/kvm): QEMU TCG, works but slow.
      useEmulation: false
    # All Beta feature gates are on by default from 1.9; nothing to enable here.
    vmRolloutStrategy: LiveUpdate
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
