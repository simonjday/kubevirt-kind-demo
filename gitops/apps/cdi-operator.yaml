apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea:3000/lab/kubevirt-kind-demo.git   # overwritten by root app
    targetRevision: main                                    # overwritten by root app
    path: gitops/platform/cdi-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: cdi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true            # KubeVirt/CDI CRDs exceed the client-side annotation limit
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
  # cdi-operator rewrites its own CRD after install -> permanent OutOfSync without this
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: cdis.cdi.kubevirt.io
      managedFieldsManagers:
        - cdi-operator
