# Applied once by scripts/04-argocd.sh (placeholders substituted there).
# The kustomize patch rewrites repoURL/targetRevision on every child Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: gitops/apps
    kustomize:
      patches:
        - target:
            group: argoproj.io
            kind: Application
          patch: |-
            - op: replace
              path: /spec/source/repoURL
              value: __REPO_URL__
            - op: replace
              path: /spec/source/targetRevision
              value: __REVISION__
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
