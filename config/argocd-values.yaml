# argo-cd chart values for a single-user lab. Production concerns flagged inline.
dex:
  enabled: false            # lab: local admin only. Prod: SSO via Dex/OIDC.
notifications:
  enabled: false
configs:
  params:
    server.insecure: true   # lab: plain HTTP behind port-forward. Prod: TLS at ingress/gateway.
    timeout.reconciliation: 60s
  cm:
    # Argo CD dropped Application health in 1.8, so sync-waves in an app-of-apps
    # don't wait for child apps. Restoring it makes operator -> CR ordering real.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    resource.customizations.health.kubevirt.io_KubeVirt: |
      hs = { status = "Progressing", message = "Waiting for KubeVirt to deploy" }
      if obj.status ~= nil and obj.status.phase == "Deployed" then
        hs.status = "Healthy"
        hs.message = "Deployed " .. (obj.status.observedKubeVirtVersion or "")
      end
      return hs
    resource.customizations.health.cdi.kubevirt.io_CDI: |
      hs = { status = "Progressing", message = "Waiting for CDI to deploy" }
      if obj.status ~= nil and obj.status.phase == "Deployed" then
        hs.status = "Healthy"
        hs.message = "Deployed " .. (obj.status.observedVersion or "")
      end
      return hs
    # Argo CD's built-in VM check reports a Halted VM as Suspended, which rolls up
    # to demo-vms and root. fedora is Halted by design (Flow 2 starts it), so treat
    # an intentionally stopped VM as Healthy. Everything else mirrors the VM's status.
    resource.customizations.health.kubevirt.io_VirtualMachine: |
      hs = { status = "Progressing", message = "Waiting for VM" }
      local ps = ""
      if obj.status ~= nil and obj.status.printableStatus ~= nil then
        ps = obj.status.printableStatus
      end
      if obj.spec ~= nil and obj.spec.runStrategy == "Halted" and (ps == "Stopped" or ps == "") then
        hs.status = "Healthy"
        hs.message = "Halted by design (runStrategy: Halted)"
        return hs
      end
      if ps == "Paused" then
        hs.status = "Suspended"
        hs.message = "Paused"
        return hs
      end
      local bad = { ErrorUnschedulable = true, ErrImagePull = true, ImagePullBackOff = true,
                    CrashLoopBackOff = true, ErrorPvcNotFound = true, ErrorDataVolumeNotFound = true,
                    DataVolumeError = true, ErrorProvisioning = true }
      if bad[ps] then
        hs.status = "Degraded"
        hs.message = ps
        return hs
      end
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = "Running"
            return hs
          end
        end
      end
      if ps ~= "" then hs.message = ps end
      return hs
